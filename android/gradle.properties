org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Workaround: Kotlin incremental compilation computes relative paths between
# the project (this repo's drive) and the pub-cache (default user-profile
# drive) and throws when they differ — common on Windows multi-drive setups.
kotlin.incremental=false
